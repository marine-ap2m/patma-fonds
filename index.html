<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Service indisponible</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --navy:#1e2a3a; --orange:#e8622a; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    font-family:'DM Sans', system-ui, sans-serif;
    background:var(--navy);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:24px;
    text-align:center;
  }
  .card {
    max-width:520px;
    width:100%;
  }
  .code {
    font-size:80px;
    font-weight:700;
    color:var(--orange);
    line-height:1;
    margin-bottom:16px;
  }
  h1 {
    font-size:26px;
    font-weight:700;
    margin-bottom:14px;
  }
  p {
    font-size:16px;
    font-weight:400;
    line-height:1.6;
    color:#c5ccd6;
    margin-bottom:10px;
  }
  .rule {
    width:56px;
    height:4px;
    background:var(--orange);
    border-radius:2px;
    margin:22px auto 0;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="code">503</div>
    <h1>Service indisponible</h1>
    <p>Cet outil est actuellement suspendu et n'est plus accessible.</p>
    <p>L'acces a l'ensemble des applications a ete desactive.</p>
    <div class="rule"></div>
  </div>
</body>
</html>
